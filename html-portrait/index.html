<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My suitcase</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>My suitcase</h1>
    <p>
      <i>
      I packed my clothes in a suitcase.<br>
      I didn't realize I was packing my past, too.</i>
    </p>
  <p>
    Hover over the objects to discover my memories.
  </p>
    <hr>
  <div class="suitcase">
    <img
    class="suitcase-img"
    src="assets/suitcase.png"
    alt="An open suitcase representing my memories"
   >
    <img
    class="item sea"
    src="assets/sea.png"
    title="HOME — I grew up close to the sea."
    alt="A sea I grew uo with"
   >
    <img
    class="item dance"
    src="assets/dance.png"
    title="DANCE — I started dancing when I was four."
    alt="Dance shoes representing my dance experience"
   >
    <img
    src="assets/cat.png"
    class="item cat"
    title="PET — The cat that stayed with me throughout my school life."
    alt="A little piece of home that I wish I could bring with me"
   >
    <img
    class="item fruit"
    src="assets/fruit.png"
    title="FRUIT — My mom always prepared fruit for me."
    alt="A familiar taste that brings me back home"
   >
    <img
    class="item ticket"
    src="assets/flight%20tickets.png"
    title="LEAVING — Qingdao to Los Angeles."
    alt="A ticket representing leaving home"
    >
 </div>
    <p>
    <b>
      A self-portrait made from the things I chose to carry.
    </b>
   </p>

  <p>
    Qingdao → Los Angeles
  </p>
  </body>
</html>
