<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open My Suitcase</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      background: #38261c;
      overflow: hidden;
      font-family: 'Cormorant Garamond', serif;
    }
    
    .cover {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: pointer;
    }
    
    .cover-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 2s ease,
       opacity 2s ease;
    }
    
    .cover::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(30, 18, 10, 0.30);
      pointer-events: none;
    }
    
    .cover-text {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      z-index: 2;
      color: #fff1d8;
      text-shadow: 0 3px 10px rgba(0,0,0,0.8);
      transition: opacity 0.8s;
    }
    
    h1 {
      font-family: 'Caveat', cursive;
      font-size: clamp(42px, 6vw, 85px);
      margin: 0;
    }
    
    p {
      font-size: 24px;
      font-style: italic;
    }
    
    .instruction {
      position: absolute;
      bottom: 9%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      color: #fff1d8;
      font-family: 'Caveat', cursive;
      font-size: 30px;
      text-align: center;
      animation: glow 2s infinite alternate;
    }
    
    @keyframes glow {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }
    
    .cover.opening .cover-image {
      transform: scale(1.3);
      opacity: 0;
    }
    
    .cover.opening .cover-text,
    .cover.opening .instruction {
      opacity: 0;
    }
  </style>
</head>

<body>
  <div class="cover" id="cover">
    <img
      src="assets/cover.png"
      alt="Vintage suitcase filled with memories"
      class="cover-image"
    >
    
    <div class="cover-text">
      <h1>The Suitcase I Carry</h1>
      <p>Every object holds a memory.</p>
    </div>
    
    <div class="instruction">
      Click to unpack my memories
    </div>
  </div>
  <script>
    const cover = document.getElementById("cover");
    cover.addEventListener("click", function () {
    cover.classList.add("opening");
    setTimeout(function () {
    window.location.href = "suitcase.html";
    }, 1900);
  }, { once: true });
  </script>
</body>
</html>
